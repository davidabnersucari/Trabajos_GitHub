name: Generar apk

on:
  push:
    branches: [ "dev-Sesion04" ]
  pull_request:
    branches: [ "dev-Sesion04" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Gluon's GraalVM
      uses: gluonhq/setup-graalvm@v1

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25b

    - name: Install native libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libavcodec-dev libavformat-dev libavutil-dev libgl1-mesa-dev libgtk-3-dev libpango1.0-dev libstdc++6 libx11-dev libxtst-dev

    - name: Build APK
      run: mvn gluonfx:build -Pandroid

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-android
        path: target/gluonfx/aarch64-android/gvm/*.apk
